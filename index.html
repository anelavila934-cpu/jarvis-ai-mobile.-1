
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0913">
<meta name="description" content="JARVIS AI - asistente personal móvil">
<link rel="manifest" href="manifest.webmanifest">
<title>JARVIS AI</title>
<style>
:root{--bg:#0b0913;--panel:#171326;--purple:#a879ff;--cyan:#6ce7f2;--text:#f5f0ff;--muted:#a69bb9}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#25163f 0%,var(--bg) 54%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
.app{max-width:650px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:22px 16px calc(16px + env(safe-area-inset-bottom))}
header{text-align:center;padding:12px 0 18px}
.brand{font-size:26px;letter-spacing:.22em;font-weight:750}
.sub{font-size:10px;letter-spacing:.2em;color:var(--purple);margin-top:5px}
.orb{width:132px;height:132px;margin:16px auto 12px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#34215c,#17112a 54%,#0b0913 72%);border:1px solid #9e75ff88;box-shadow:0 0 35px #8b5cf655,inset 0 0 25px #8b5cf633;position:relative}
.orb:before,.orb:after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid #8f6be866;animation:pulse 3s infinite}
.orb:after{inset:-17px;opacity:.45;animation-delay:1s}
.orb span{font-size:47px;color:var(--cyan);text-shadow:0 0 22px #6ce7f2}
@keyframes pulse{50%{transform:scale(1.07);opacity:.25}}
.status{font-size:11px;color:var(--cyan);letter-spacing:.14em}
.chat{flex:1;min-height:180px;max-height:48vh;overflow:auto;background:#171326bb;border:1px solid #ffffff12;border-radius:18px;padding:13px;margin:10px 0}
.msg{padding:11px 13px;border-radius:14px;margin:8px 0;line-height:1.45;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:#29203c;border:1px solid #a879ff25}
.user{background:#34205a;margin-left:22px}
.tag{font-size:9px;letter-spacing:.15em;color:var(--purple);font-weight:700;margin-bottom:4px}
.controls{display:flex;gap:8px}
.controls input{min-width:0;flex:1;background:#1b1729;border:1px solid #ffffff20;border-radius:24px;padding:14px;color:white;font-size:15px;outline:none}
button{border:0;border-radius:22px;background:linear-gradient(135deg,#9d70f6,#6542b7);color:white;font-size:17px;min-width:48px;padding:0 15px;font-weight:700}
button:disabled{opacity:.5}
.hint{text-align:center;color:var(--muted);font-size:10px;padding:12px 4px}
footer{display:flex;justify-content:space-between;color:#776d89;font-size:10px;padding:7px 3px}
</style>
</head>
<body>
<main class="app">
<header>
<div class="brand">J.A.R.V.I.S</div>
<div class="sub">PERSONAL AI SYSTEM · MOBILE</div>
<div class="orb"><span>◉</span></div>
<div class="status" id="status">● SISTEMA EN LÍNEA</div>
</header>
<section class="chat" id="chat" aria-live="polite">
<div class="msg bot"><div class="tag">JARVIS</div><div>Buenos días. Sistema iniciado. Soy JARVIS, tu asistente personal. ¿En qué puedo ayudarte?</div></div>
</section>
<form class="controls" id="form">
<input id="prompt" autocomplete="off" placeholder="Escribe un mensaje..." aria-label="Mensaje">
<button type="button" id="mic" aria-label="Dictar">🎙</button>
<button type="submit" id="send" aria-label="Enviar">➤</button>
</form>
<div class="hint" id="hint">JARVIS AI · CONECTANDO SERVIDOR</div>
<footer><span>JARVIS MOBILE</span><span>SECURE SESSION</span></footer>
</main>
<script>
const API_URL="https://jarvis-ai-server.anelavila934.workers.dev";

const chat=document.querySelector('#chat');
const input=document.querySelector('#prompt');
const statusEl=document.querySelector('#status');
const send=document.querySelector('#send');
const hint=document.querySelector('#hint');

function add(who,text){
 const d=document.createElement('div');
 d.className='msg '+(who==='TÚ'?'user':'bot');
 const t=document.createElement('div');
 t.className='tag';
 t.textContent=who;
 const b=document.createElement('div');
 b.textContent=text;
 d.append(t,b);
 chat.append(d);
 chat.scrollTop=chat.scrollHeight;
}

function speak(s){
 if('speechSynthesis' in window){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(s);
  u.lang='es-PA';
  speechSynthesis.speak(u);
 }
}

async function askJarvis(message){
 const response=await fetch(API_URL,{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({message})
 });
 const data=await response.json();
 if(!response.ok)throw new Error(data.error||'Error del servidor');
 if(typeof data.answer!=='string')throw new Error('Respuesta inválida');
 return data.answer;
}

document.querySelector('#form').addEventListener('submit',async e=>{
 e.preventDefault();
 const message=input.value.trim();
 if(!message||send.disabled)return;

 input.value='';
 add('TÚ',message);
 send.disabled=true;
 statusEl.textContent='● JARVIS ESTÁ PENSANDO';
 hint.textContent='PROCESANDO SOLICITUD...';

 try{
  const answer=await askJarvis(message);
  add('JARVIS',answer);
  speak(answer);
  statusEl.textContent='● SISTEMA EN LÍNEA';
  hint.textContent='JARVIS AI · CONECTADO';
 }catch(error){
  add('JARVIS','No pude conectarme al servidor. Comprueba tu conexión e inténtalo nuevamente.');
  statusEl.textContent='● ERROR DE CONEXIÓN';
  hint.textContent='REVISA EL SERVIDOR';
  console.error(error);
 }finally{
  send.disabled=false;
  input.focus();
 }
});

document.querySelector('#mic').addEventListener('click',()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  statusEl.textContent='● DICTADO NO DISPONIBLE';
  return;
 }
 const r=new SR();
 r.lang='es-PA';
 r.interimResults=false;
 r.onstart=()=>statusEl.textContent='● ESCUCHANDO';
 r.onend=()=>statusEl.textContent='● SISTEMA EN LÍNEA';
 r.onerror=()=>statusEl.textContent='● ERROR DE MICRÓFONO';
 r.onresult=e=>{
  input.value=e.results[0][0].transcript;
  document.querySelector('#form').requestSubmit();
 };
 r.start();
});

if('serviceWorker'in navigator && location.protocol.startsWith('http')){
 navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
